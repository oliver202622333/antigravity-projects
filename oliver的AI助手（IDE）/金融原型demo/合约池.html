<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>固定合约池</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: #2A2A2A;
            color: #E0E0E0;
            font-size: 14px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 弹窗容器 */
        .modal {
            width: 1400px;
            height: 700px;
            background: #1E1E1E;
            border: 1px solid #444444;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        /* 弹窗头部 */
        .modal-header {
            height: 45px;
            background: #2A2A2A;
            border-bottom: 1px solid #444444;
            display: flex;
            align-items: center;
            padding: 0 16px;
            position: relative;
        }

            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin-right: 10px;
        }

        .modal-header .title {
            font-size: 15px;
            font-weight: bold;
            color: #E0E0E0;
        }

        .modal-header .close {
            margin-left: auto;
            cursor: pointer;
            color: #888;
            font-size: 20px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .modal-header .close:hover {
            background: #444444;
            color: #E0E0E0;
        }


        /* 弹窗主体 */
        .modal-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 左侧面板 */
        .left-panel {
            width: 35%;
            background: #1E1E1E;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        /* 右侧面板 */
        .right-panel {
            width: 65%;
            background: #1E1E1E;
            display: flex;
            flex-direction: column;
            padding: 16px;
            border-left: 1px solid #444444;
        }

        /* 面板标题区 */
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .panel-title {
            font-size: 14px;
            color: #E0E0E0;
        }

        .panel-actions {
            display: flex;
            gap: 8px;
        }

        /* 按钮样式 */
        .btn {
            padding: 6px 14px;
            border: 1px solid #555;
            background: #2A2A2A;
            color: #E0E0E0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn:hover {
            background: #3A3A3A;
            border-color: #666;
        }

        .btn-primary {
            background: #2196F3;
            color: #fff;
            border-color: #2196F3;
        }

        .btn-primary:hover {
            background: #1976D2;
            border-color: #1976D2;
        }

        .btn-danger {
            background: #d22d8d;
            color: #fff;
            border-color: #d22d8d;
        }

        .btn-danger:hover {
            background: #b01e6e;
            border-color: #b01e6e;
        }

        /* Tab导航 */
        .tabs {
            display: flex;
            background: #2A2A2A;
            border-radius: 4px;
            padding: 4px;
            margin-bottom: 12px;
            gap: 2px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 8px 14px;
            cursor: pointer;
            color: #888;
            font-size: 13px;
            border-radius: 3px;
            transition: all 0.3s;
            white-space: nowrap;
            position: relative;
        }

        .tab:hover {
            color: #E0E0E0;
            background: #3A3A3A;
        }

        .tab.active {
            color: #2196F3;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 8px;
            right: 8px;
            height: 2px;
            background: #2196F3;
        }

        /* 搜索区 */
        .search-area {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-input {
            flex: 1;
            background: #2A2A2A;
            border: 1px solid #444444;
            color: #E0E0E0;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
        }

        .search-input::placeholder {
            color: #666;
        }

        .search-input:focus {
            outline: none;
            border-color: #2196F3;
        }

        /* 表格区域 */
        .table-container {
            flex: 1;
            overflow: auto;
            background: #1A1A1A;
            border: 1px solid #444444;
            border-radius: 4px;
        }

        /* 自定义滚动条 */
        .table-container::-webkit-scrollbar {
            width: 8px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #1A1A1A;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #444444;
            border-radius: 4px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: #555555;
        }

        /* 表格样式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table th {
            background: #2A2A2A;
            color: #888;
            font-weight: normal;
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #444444;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table td {
            padding: 10px;
            border-bottom: 1px solid #333333;
            color: #E0E0E0;
        }

        .data-table tr:hover td {
            background: #252525;
        }

        .data-table .checkbox-cell {
            width: 50px;
            text-align: center;
        }

        /* 自定义复选框 */
        .custom-checkbox {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 1px solid #666;
            border-radius: 3px;
            background: #1E1E1E;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .custom-checkbox:hover {
            border-color: #2196F3;
        }

        .custom-checkbox.checked {
            background: #2196F3;
            border-color: #2196F3;
        }

        .custom-checkbox.checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 11px;
        }

        .data-table .custom-checkbox {
            margin: 0 auto;
        }

        /* 板块下拉箭头 */
        .sort-arrow {
            display: inline-block;
            margin-left: 4px;
            color: #666;
            font-size: 10px;
        }

        /* 底部操作区 */
        .panel-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #444444;
        }

        .footer-right {
            display: flex;
            gap: 8px;
        }

        .footer-left {
            display: flex;
            gap: 8px;
        }

        /* 统计信息 */
        .stats {
            color: #666;
            font-size: 12px;
        }

        .stats .value {
            color: #2196F3;
            font-weight: bold;
        }

        /* 树形控件 */
        .tree-view {
            padding: 8px;
        }

        .tree-node {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s;
        }

        .tree-node:hover {
            background: #252525;
        }

        .tree-node.highlight {
            background: #1565C0;
        }

        .tree-node .arrow {
            width: 20px;
            text-align: center;
            color: #888;
            font-size: 10px;
            transition: transform 0.3s;
        }

        .tree-node .arrow.expanded {
            transform: rotate(90deg);
        }

        .tree-node .indent {
            display: inline-block;
        }

        .tree-node .checkbox {
            margin-right: 8px;
        }

        .tree-node .add-icon {
            color: #888;
            font-size: 14px;
            margin-right: 6px;
            cursor: pointer;
        }

        .tree-node .add-icon:hover {
            color: #2196F3;
        }

        .tree-node .text {
            color: #E0E0E0;
            font-size: 13px;
        }

        .tree-children {
            margin-left: 20px;
        }

        .tree-children.hidden {
            display: none;
        }

    </style>
</head>
<body>
    <div class="overlay">
        <div class="modal">
            <!-- 弹窗头部 -->
            <div class="modal-header">
                <div class="icon"></div>
                <div class="title">固定合约池</div>
                <div class="close">×</div>
            </div>

            <!-- 弹窗主体 -->
            <div class="modal-body">
                <!-- 左侧面板 - 已选区域 -->
                <div class="left-panel">
                    <div class="panel-header">
                        <div class="panel-title">已选: <span id="selectedCount" class="stats value">1</span></div>
                        <div class="panel-actions">
                            <button class="btn">删除</button>
                            <button class="btn btn-danger">清空</button>
                        </div>
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th class="checkbox-cell"><div class="custom-checkbox" id="leftSelectAll"></div></th>
                                    <th>合约代码</th>
                                    <th>合约名</th>
                                    <th>是否交易合约</th>
                                </tr>
                            </thead>
                            <tbody id="leftTableBody">
                                <tr>
                                    <td class="checkbox-cell"><div class="custom-checkbox"></div></td>
                                    <td>IC2606</td>
                                    <td>中证500股指...</td>
                                    <td>否</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="panel-footer">
                        <div class="footer-left">
                            <button class="btn">另存为自定义组</button>
                        </div>
                        <div class="footer-right">
                            <button class="btn btn-primary">确定</button>
                            <button class="btn">取消</button>
                        </div>
                    </div>
                </div>

                <!-- 右侧面板 - 候选区域 -->
                <div class="right-panel">
                    <div class="tabs">
                        <div class="tab" data-type="index">股指</div>
                        <div class="tab" data-type="futures">商品期货</div>
                        <div class="tab" data-type="stock">股票</div>
                        <div class="tab" data-type="hkstock">港股通</div>
                        <div class="tab" data-type="cnindex">指数</div>
                        <div class="tab" data-type="commodity">商品指数</div>
                        <div class="tab active" data-type="component">指数成分股</div>
                        <div class="tab" data-type="etf">ETF</div>
                        <div class="tab" data-type="custom">自定义组</div>
                        <div class="tab" data-type="option">期权</div>
                        <div class="tab" data-type="history">历史期货</div>
                    </div>

                    <div class="search-area">
                        <input type="text" class="search-input" placeholder="输入代码/名称/关键词等进行模糊查询">
                        <button class="btn">精确查询</button>
                        <button class="btn">全选</button>
                    </div>

                    <!-- 表格区域 - 动态切换 -->
                    <div class="table-container" id="rightContentArea">
                        <!-- 内容将通过JS动态填充 -->
                    </div>

                    <div class="panel-footer">
                        <div class="footer-left">
                            <span class="stats">总计: <span class="value" id="totalCount">0</span></span>
                        </div>
                        <div class="footer-right">
                            <button class="btn">导出</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>

        const mockData = {

            commodity: [
                { code: 'NHA0000', name: '南华农产品[指数]', board: '南华' },
                { code: 'NHC0000', name: '南华商品[指数]', board: '南华' },
                { code: 'NHA0001', name: '南华金属[指数]', board: '南华' },
                { code: 'NHA0002', name: '南华能化[指数]', board: '南华' },
                { code: 'NHA0003', name: '南华黑色[指数]', board: '南华' },
                { code: 'NHA0004', name: '南华贵金属[指数]', board: '南华' },
                { code: 'NHA0005', name: '南华工业品[指数]', board: '南华' },
            ]
        };

        // 树形数据
        const treeData = {
            root: [
                {
                    id: 1,
                    text: '000905SH 中证500历史成分股',
                    arrow: '▶',
                    children: []
                },
                {
                    id: 2,
                    text: '000905SH 中证500最新成分股',
                    arrow: '▶',
                    children: []
                },
                {
                    id: 3,
                    text: '同花顺指数最新成分股',
                    arrow: '▼',
                    expanded: true,
                    children: [
                        {
                            id: 4,
                            text: '概念指数',
                            arrow: '▶',
                            children: []
                        },
                        {
                            id: 5,
                            text: '行业指数',
                            arrow: '▶',
                            children: []
                        },
                        {
                            id: 6,
                            text: '地域指数',
                            arrow: '▶',
                            children: []
                        },
                        {
                            id: 7,
                            text: '特色指数',
                            arrow: '▼',
                            expanded: true,
                            children: [
                                {
                                    id: 8,
                                    text: '883400TI 昨日ST首板股表现',
                                    arrow: '▶',
                                    hasAddIcon: true,
                                    children: []
                                },
                                {
                                    id: 9,
                                    text: '883403TI 佛山',
                                    arrow: '▶',
                                    hasAddIcon: true,
                                    children: []
                                }
                            ]
                        }
                    ]
                },
                {
                    id: 10,
                    text: '选股通指数最新成分股',
                    arrow: '▼',
                    expanded: true,
                    children: [
                        {
                            id: 11,
                            text: '行业指数',
                            arrow: '▶',
                            children: []
                        },
                        {
                            id: 12,
                            text: '概念指数',
                            arrow: '▶',
                            children: []
                        },
                        {
                            id: 13,
                            text: '风格指数',
                            arrow: '▶',
                            children: []
                        }
                    ]
                },
                {
                    id: 14,
                    text: '能化指数最新成分股',
                    arrow: '▼',
                    expanded: true,
                    children: [
                        {
                            id: 15,
                            text: '换手率指数',
                            arrow: '▶',
                            children: []
                        },
                        {
                            id: 16,
                            text: '跌停指数',
                            arrow: '▶',
                            children: []
                        }
                    ]
                }
            ]
        };

        let currentType = 'component';
        let selectedItems = [
            { code: 'IC2606', name: '中证500股指...', isTrading: false }
        ];

        // Tab切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentType = this.dataset.type;
                renderRightContent();
            });
        });

        // 渲染右侧内容
        function renderRightContent() {
            const container = document.getElementById('rightContentArea');

            if (currentType === 'component') {
                // 场景C：树形控件
                renderTreeView(container);
                document.getElementById('totalCount').textContent = countTreeNodes(treeData.root);
            } else if (currentType === 'hkstock') {
                // 场景B：港股通（3列，无板块列）
                renderTable(container, mockData.hkstock, false);
            } else {
                // 场景A：标准表格（4列，有板块列）
                const data = mockData[currentType] || [];
                renderTable(container, data, true);
            }
        }

        // 渲染标准表格
        function renderTable(container, data, showBoard) {
            const table = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th class="checkbox-cell"><div class="custom-checkbox" id="rightSelectAll"></div></th>
                            <th>代码</th>
                            <th>名称</th>
                            ${showBoard ? '<th>板块<span class="sort-arrow">▼</span></th>' : ''}
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map((item, index) => `
                            <tr data-index="${index}">
                                <td class="checkbox-cell">
                                    <div class="custom-checkbox"
                                         data-code="${item.code}"
                                         data-name="${item.name}"
                                         data-board="${item.board || ''}"
                                         onclick="toggleSelect(this, ${index})"></div>
                                </td>
                                <td>${item.code}</td>
                                <td>${item.name}</td>
                                ${showBoard ? `<td>${item.board || ''}</td>` : ''}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            container.innerHTML = table;
            document.getElementById('totalCount').textContent = data.length;
        }

        // 渲染树形控件
        function renderTreeView(container) {
            const html = `
                <div class="tree-view">
                    ${renderTreeNodes(treeData.root, 0)}
                </div>
            `;
            container.innerHTML = html;

            // 绑定树形控件事件
            bindTreeEvents();
        }

        // 递归渲染树节点
        function renderTreeNodes(nodes, level) {
            return nodes.map(node => {
                const indent = level > 0 ? `<span class="indent" style="width: ${level * 20}px;"></span>` : '';
                const expandedClass = node.expanded ? 'expanded' : '';
                const addIcon = node.hasAddIcon ? '<span class="add-icon">⊕</span>' : '';
                const childrenClass = node.expanded ? '' : 'hidden';

                const nodeHtml = `
                    <div class="tree-node" data-id="${node.id}" data-expanded="${node.expanded || false}">
                        ${indent}
                        <span class="arrow ${expandedClass}">${node.arrow}</span>
                        <span class="checkbox"><div class="custom-checkbox"></div></span>
                        ${addIcon}
                        <span class="text">${node.text}</span>
                    </div>
                `;

                const childrenHtml = node.children && node.children.length > 0 ? `
                    <div class="tree-children ${childrenClass}" data-parent-id="${node.id}">
                        ${renderTreeNodes(node.children, level + 1)}
                    </div>
                ` : '';

                return nodeHtml + childrenHtml;
            }).join('');
        }

        // 绑定树形控件事件
        function bindTreeEvents() {
            // 展开/折叠
            document.querySelectorAll('.tree-node .arrow').forEach(arrow => {
                arrow.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const node = this.closest('.tree-node');
                    const nodeId = node.dataset.id;
                    const childrenContainer = document.querySelector(`.tree-children[data-parent-id="${nodeId}"]`);

                    if (childrenContainer) {
                        childrenContainer.classList.toggle('hidden');
                        this.classList.toggle('expanded');
                        node.dataset.expanded = childrenContainer.classList.contains('hidden') ? 'false' : 'true';
                    }
                });
            });

            // 点击节点
            document.querySelectorAll('.tree-node').forEach(node => {
                node.addEventListener('click', function(e) {
                    if (e.target.classList.contains('arrow') || e.target.classList.contains('custom-checkbox') || e.target.classList.contains('add-icon')) {
                        return;
                    }

                    // 移除其他节点高亮
                    document.querySelectorAll('.tree-node').forEach(n => {
                        if (!n.classList.contains('root-highlight')) {
                            n.classList.remove('highlight');
                        }
                    });

                    if (!this.classList.contains('root-highlight')) {
                        this.classList.add('highlight');
                    }
                });
            });
        }

        // 计算树节点数量
        function countTreeNodes(nodes) {
            let count = 0;
            nodes.forEach(node => {
                count++;
                if (node.children) {
                    count += countTreeNodes(node.children);
                }
            });
            return count;
        }

        // 切换右侧复选框
        function toggleSelect(checkbox, index) {
            const data = mockData[currentType] || [];
            const item = data[index];

            if (checkbox.classList.contains('checked')) {
                checkbox.classList.remove('checked');

                // 从左侧移除
                selectedItems = selectedItems.filter(d => d.code !== item.code);
            } else {
                checkbox.classList.add('checked');

                // 添加到左侧
                const exists = selectedItems.find(d => d.code === item.code);
                if (!exists) {
                    selectedItems.push({
                        code: item.code,
                        name: item.name,
                        isTrading: false
                    });
                }
            }

            renderLeftTable();
        }

        // 渲染左侧表格
        function renderLeftTable() {
            const tbody = document.getElementById('leftTableBody');
            document.getElementById('selectedCount').textContent = selectedItems.length;

            if (selectedData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align: center; color: #666; padding: 40px;">
                            暂无已选数据
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = selectedData.map((item, index) => `
                    <tr data-index="${index}">
                        <td class="checkbox-cell">
                            <div class="custom-checkbox"></div>
                        </td>
                        <td>${item.code}</td>
                        <td>${item.name}</td>
                        <td>${item.isTrading ? '是' : '否'}</td>
                    </tr>
                `).join('');
            }
        }

        // 右侧全选
        document.addEventListener('click', function(e) {
            if (e.target.id === 'rightSelectAll') {
                const checkbox = e.target;
                const isChecked = checkbox.classList.toggle('checked');
                const checkboxes = document.querySelectorAll('#rightContentArea tbody .custom-checkbox');

                checkboxes.forEach(cb => {
                    const code = cb.dataset.code;
                    const name = cb.dataset.name;

                    if (isChecked) {
                        cb.classList.add('checked');

                        const exists = selectedItems.find(d => d.code === code);
                        if (!exists) {
                            selectedItems.push({
                                code: code,
                                name: name,
                                isTrading: false
                            });
                        }
                    } else {
                        cb.classList.remove('checked');

                        selectedItems = selectedItems.filter(d => d.code !== code);
                    }
                });

                renderLeftTable();
            }
        });

        // 左侧全选
        document.getElementById('leftSelectAll').addEventListener('click', function() {
            const isChecked = this.classList.toggle('checked');
            const checkboxes = document.querySelectorAll('#leftTableBody .custom-checkbox');

            checkboxes.forEach(checkbox => {
                if (isChecked) {
                    checkbox.classList.add('checked');
                } else {
                    checkbox.classList.remove('checked');
                }
            });
        });

        // 清空按钮
        document.querySelector('.btn-danger').addEventListener('click', function() {
            selectedData = [];

            // 取消右侧所有选中
            document.querySelectorAll('#rightContentArea tbody .custom-checkbox').forEach(checkbox => {
                checkbox.classList.remove('checked');
            });

            renderLeftTable();
        });

        // 删除按钮
        document.querySelectorAll('.btn')[0].addEventListener('click', function() {
            const checkedItems = document.querySelectorAll('#leftTableBody .custom-checkbox.checked');

            checkedItems.forEach(checkbox => {
                const row = checkbox.closest('tr');
                const index = row.dataset.index;
                const item = selectedData[index];

                // 从左侧移除
                selectedData = selectedData.filter((d, i) => i !== index);

                // 取消右侧对应项选中
                const rightCheckbox = document.querySelector(`#rightContentArea .custom-checkbox[data-code="${item.code}"]`);
                if (rightCheckbox) {
                    rightCheckbox.classList.remove('checked');
                }
            });

            renderLeftTable();
        });

        // 关闭按钮
        document.querySelector('.close').addEventListener('click', function() {
            document.querySelector('.overlay').style.display = 'none';
        });

        // 取消按钮
        document.querySelectorAll('.btn')[3].addEventListener('click', function() {
            document.querySelector('.overlay').style.display = 'none';
        });

        // 初始化
        renderRightContent();
    </script>
</body>
</html>
