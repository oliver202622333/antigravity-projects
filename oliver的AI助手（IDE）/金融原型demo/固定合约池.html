<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>固定合约池</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: #2A2A2A;
            color: #E0E0E0;
            font-size: 14px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 弹窗容器 */
        .modal {
            width: 1300px;
            height: 600px;
            background: #1E1E1E;
            border: 1px solid #444444;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        /* 弹窗头部 */
        .modal-header {
            height: 45px;
            background: #2A2A2A;
            border-bottom: 1px solid #444444;
            display: flex;
            align-items: center;
            padding: 0 16px;
            position: relative;
        }

        .modal-header .icon {
            width: 20px;
            height: 20px;
            background: #d22d8d;
            border-radius: 3px;
            margin-right: 10px;
        }

        .modal-header .title {
            font-size: 15px;
            font-weight: bold;
            color: #E0E0E0;
        }

        .modal-header .close {
            margin-left: auto;
            cursor: pointer;
            color: #888;
            font-size: 20px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .modal-header .close:hover {
            background: #444444;
            color: #E0E0E0;
        }

        /* 头部蓝色高亮线 */
        .header-highlight {
            position: absolute;
            left: 16px;
            bottom: -1px;
            width: 30px;
            height: 2px;
            background: #2196F3;
        }

        /* 弹窗主体 */
        .modal-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 左侧面板 */
        .left-panel {
            width: 35%;
            background: #1E1E1E;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        /* 右侧面板 */
        .right-panel {
            width: 65%;
            background: #1E1E1E;
            display: flex;
            flex-direction: column;
            padding: 16px;
            border-left: 1px solid #444444;
        }

        /* 面板标题区 */
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .panel-title {
            font-size: 14px;
            color: #E0E0E0;
        }

        .panel-actions {
            display: flex;
            gap: 8px;
        }

        /* 按钮样式 */
        .btn {
            padding: 6px 14px;
            border: 1px solid #555;
            background: #2A2A2A;
            color: #E0E0E0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn:hover {
            background: #3A3A3A;
            border-color: #666;
        }

        .btn-primary {
            background: #2196F3;
            color: #fff;
            border-color: #2196F3;
        }

        .btn-primary:hover {
            background: #1976D2;
            border-color: #1976D2;
        }

        .btn-danger {
            background: #d22d8d;
            color: #fff;
            border-color: #d22d8d;
        }

        .btn-danger:hover {
            background: #b01e6e;
            border-color: #b01e6e;
        }

        /* Tab导航 */
        .tabs {
            display: flex;
            background: #2A2A2A;
            border-radius: 4px;
            padding: 4px;
            margin-bottom: 12px;
            gap: 2px;
        }

        .tab {
            padding: 8px 16px;
            cursor: pointer;
            color: #888;
            font-size: 13px;
            border-radius: 3px;
            transition: all 0.3s;
            white-space: nowrap;
            position: relative;
        }

        .tab:hover {
            color: #E0E0E0;
            background: #3A3A3A;
        }

        .tab.active {
            color: #2196F3;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 8px;
            right: 8px;
            height: 2px;
            background: #2196F3;
        }

        /* 搜索区 */
        .search-area {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-input {
            flex: 1;
            background: #2A2A2A;
            border: 1px solid #444444;
            color: #E0E0E0;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
        }

        .search-input::placeholder {
            color: #666;
        }

        .search-input:focus {
            outline: none;
            border-color: #2196F3;
        }

        /* 表格区域 */
        .table-container {
            flex: 1;
            overflow: auto;
            background: #1A1A1A;
            border: 1px solid #444444;
            border-radius: 4px;
        }

        /* 自定义滚动条 */
        .table-container::-webkit-scrollbar {
            width: 8px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #1A1A1A;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #444444;
            border-radius: 4px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: #555555;
        }

        /* 表格样式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table th {
            background: #2A2A2A;
            color: #888;
            font-weight: normal;
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #444444;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table td {
            padding: 10px;
            border-bottom: 1px solid #333333;
            color: #E0E0E0;
        }

        .data-table tr:hover td {
            background: #252525;
        }

        .data-table .checkbox-cell {
            width: 50px;
            text-align: center;
        }

        /* 自定义复选框 */
        .custom-checkbox {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 1px solid #666;
            border-radius: 3px;
            background: #1E1E1E;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .custom-checkbox:hover {
            border-color: #2196F3;
        }

        .custom-checkbox.checked {
            background: #2196F3;
            border-color: #2196F3;
        }

        .custom-checkbox.checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 11px;
        }

        .data-table .custom-checkbox {
            margin: 0 auto;
        }

        /* 板块下拉箭头 */
        .sort-arrow {
            display: inline-block;
            margin-left: 4px;
            color: #666;
            font-size: 10px;
        }

        /* 底部操作区 */
        .panel-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #444444;
        }

        .footer-right {
            display: flex;
            gap: 8px;
        }

        .footer-left {
            margin-left: auto;
        }

        /* 统计信息 */
        .stats {
            color: #666;
            font-size: 12px;
        }

        .stats .value {
            color: #2196F3;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="modal">
            <!-- 弹窗头部 -->
            <div class="modal-header">
                <div class="icon"></div>
                <div class="title">固定合约池</div>
                <div class="close">×</div>
                <div class="header-highlight"></div>
            </div>

            <!-- 弹窗主体 -->
            <div class="modal-body">
                <!-- 左侧面板 - 已选区域 -->
                <div class="left-panel">
                    <div class="panel-header">
                        <div class="panel-title">已选: <span id="selectedCount" class="stats value">1</span></div>
                        <div class="panel-actions">
                            <button class="btn">删除</button>
                            <button class="btn btn-danger">清空</button>
                        </div>
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th class="checkbox-cell"><div class="custom-checkbox" id="leftSelectAll"></div></th>
                                    <th>合约代码</th>
                                    <th>合约名</th>
                                    <th>是否交易合约</th>
                                </tr>
                            </thead>
                            <tbody id="leftTableBody">
                                <tr>
                                    <td class="checkbox-cell"><div class="custom-checkbox"></div></td>
                                    <td>IC2606</td>
                                    <td>中证500股指...</td>
                                    <td>否</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="panel-footer">
                        <div class="footer-left">
                            <button class="btn">另存为自定义组</button>
                        </div>
                        <div class="footer-right">
                            <button class="btn btn-primary">确定</button>
                            <button class="btn">取消</button>
                        </div>
                    </div>
                </div>

                <!-- 右侧面板 - 候选区域 -->
                <div class="right-panel">
                    <div class="tabs">
                        <div class="tab active">股指</div>
                        <div class="tab">商品期货</div>
                        <div class="tab">股票</div>
                        <div class="tab">指数</div>
                        <div class="tab">指数成分股</div>
                        <div class="tab">ETF</div>
                        <div class="tab">自定义组</div>
                        <div class="tab">期权</div>
                        <div class="tab">历史期货</div>
                    </div>

                    <div class="search-area">
                        <input type="text" class="search-input" placeholder="输入代码/名称/关键词等进行模糊查询">
                        <button class="btn">精确查询</button>
                        <button class="btn">全选</button>
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th class="checkbox-cell"><div class="custom-checkbox" id="rightSelectAll"></div></th>
                                    <th>代码</th>
                                    <th>名称</th>
                                    <th>板块<span class="sort-arrow">▼</span></th>
                                </tr>
                            </thead>
                            <tbody id="rightTableBody">
                                <!-- 数据将通过JS动态填充 -->
                            </tbody>
                        </table>
                    </div>

                    <div class="panel-footer">
                        <div class="footer-left">
                            <span class="stats">总计: <span class="value" id="totalCount">12</span></span>
                        </div>
                        <div class="footer-right">
                            <button class="btn">导出</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 候选数据
        const candidateData = [
            { code: 'IC0000', name: '中证500当月连续', board: '股指' },
            { code: 'IC2606', name: '中证500 2406', board: '股指', selected: true },
            { code: 'IC2607', name: '中证500 2407', board: '股指' },
            { code: 'IC2608', name: '中证500 2408', board: '股指' },
            { code: 'IC2609', name: '中证500 2409', board: '股指' },
            { code: 'IC2610', name: '中证500 2410', board: '股指' },
            { code: 'IC2611', name: '中证500 2411', board: '股指' },
            { code: 'IC2612', name: '中证500 2412', board: '股指' },
            { code: 'IF2606', name: '沪深300 2406', board: '股指' },
            { code: 'IF2607', name: '沪深300 2407', board: '股指' },
            { code: 'IF2608', name: '沪深300 2408', board: '股指' },
            { code: 'IF2609', name: '沪深300 2409', board: '股指' },
        ];

        // 已选数据
        let selectedData = [
            { code: 'IC2606', name: '中证500股指...', isTrading: false }
        ];

        // 渲染右侧表格
        function renderRightTable() {
            const tbody = document.getElementById('rightTableBody');
            tbody.innerHTML = candidateData.map((item, index) => `
                <tr data-index="${index}">
                    <td class="checkbox-cell">
                        <div class="custom-checkbox ${item.selected ? 'checked' : ''}"
                             data-code="${item.code}"
                             data-name="${item.name}"
                             data-board="${item.board}"
                             onclick="toggleSelect(this, ${index})"></div>
                    </td>
                    <td>${item.code}</td>
                    <td>${item.name}</td>
                    <td>${item.board}</td>
                </tr>
            `).join('');

            document.getElementById('totalCount').textContent = candidateData.length;
        }

        // 渲染左侧表格
        function renderLeftTable() {
            const tbody = document.getElementById('leftTableBody');
            if (selectedData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align: center; color: #666; padding: 40px;">
                            暂无已选数据
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = selectedData.map((item, index) => `
                    <tr data-index="${index}">
                        <td class="checkbox-cell">
                            <div class="custom-checkbox"
                                 data-code="${item.code}"
                                 onclick="toggleLeftSelect(this, ${index})"></div>
                        </td>
                        <td>${item.code}</td>
                        <td>${item.name}</td>
                        <td>${item.isTrading ? '是' : '否'}</td>
                    </tr>
                `).join('');
            }

            document.getElementById('selectedCount').textContent = selectedData.length;
        }

        // 切换右侧复选框
        function toggleSelect(checkbox, index) {
            const item = candidateData[index];

            if (checkbox.classList.contains('checked')) {
                // 取消选中
                checkbox.classList.remove('checked');
                item.selected = false;

                // 从左侧移除
                selectedData = selectedData.filter(d => d.code !== item.code);
            } else {
                // 选中
                checkbox.classList.add('checked');
                item.selected = true;

                // 添加到左侧
                const exists = selectedData.find(d => d.code === item.code);
                if (!exists) {
                    selectedData.push({
                        code: item.code,
                        name: item.name,
                        isTrading: false
                    });
                }
            }

            renderLeftTable();
        }

        // 切换左侧复选框
        function toggleLeftSelect(checkbox, index) {
            const item = selectedData[index];
            const rightIndex = candidateData.findIndex(d => d.code === item.code);

            if (checkbox.classList.contains('checked')) {
                checkbox.classList.remove('checked');
            } else {
                checkbox.classList.add('checked');
            }
        }

        // 右侧全选
        document.getElementById('rightSelectAll').addEventListener('click', function() {
            const isChecked = this.classList.toggle('checked');
            const checkboxes = document.querySelectorAll('#rightTableBody .custom-checkbox');

            checkboxes.forEach((checkbox, index) => {
                const item = candidateData[index];

                if (isChecked) {
                    checkbox.classList.add('checked');
                    item.selected = true;

                    const exists = selectedData.find(d => d.code === item.code);
                    if (!exists) {
                        selectedData.push({
                            code: item.code,
                            name: item.name,
                            isTrading: false
                        });
                    }
                } else {
                    checkbox.classList.remove('checked');
                    item.selected = false;

                    selectedData = selectedData.filter(d => d.code !== item.code);
                }
            });

            renderLeftTable();
        });

        // 左侧全选
        document.getElementById('leftSelectAll').addEventListener('click', function() {
            const isChecked = this.classList.toggle('checked');
            const checkboxes = document.querySelectorAll('#leftTableBody .custom-checkbox');

            checkboxes.forEach(checkbox => {
                if (isChecked) {
                    checkbox.classList.add('checked');
                } else {
                    checkbox.classList.remove('checked');
                }
            });
        });

        // 清空按钮
        document.querySelector('.btn-danger').addEventListener('click', function() {
            selectedData = [];

            // 取消右侧所有选中
            candidateData.forEach(item => item.selected = false);
            document.querySelectorAll('#rightTableBody .custom-checkbox').forEach(checkbox => {
                checkbox.classList.remove('checked');
            });

            renderLeftTable();
        });

        // 删除按钮
        document.querySelectorAll('.btn')[0].addEventListener('click', function() {
            const checkedItems = document.querySelectorAll('#leftTableBody .custom-checkbox.checked');

            checkedItems.forEach(checkbox => {
                const code = checkbox.dataset.code;

                // 从左侧移除
                selectedData = selectedData.filter(d => d.code !== code);

                // 取消右侧对应项选中
                const rightIndex = candidateData.findIndex(d => d.code === code);
                if (rightIndex !== -1) {
                    candidateData[rightIndex].selected = false;
                    const rightCheckbox = document.querySelector(`#rightTableBody .custom-checkbox[data-code="${code}"]`);
                    if (rightCheckbox) {
                        rightCheckbox.classList.remove('checked');
                    }
                }
            });

            renderLeftTable();
        });

        // Tab切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 关闭按钮
        document.querySelector('.close').addEventListener('click', function() {
            document.querySelector('.overlay').style.display = 'none';
        });

        // 取消按钮
        document.querySelectorAll('.btn')[3].addEventListener('click', function() {
            document.querySelector('.overlay').style.display = 'none';
        });

        // 初始化
        renderRightTable();
        renderLeftTable();
    </script>
</body>
</html>
